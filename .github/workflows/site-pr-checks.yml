# Reusable PR checks for rp-site-* tenant repos (site engine v3, plan §6).
# Tenant repos call this via a thin caller workflow; the branch ruleset requires
# these named jobs, so a tenant repo cannot weaken the gate without visibly
# failing required checks. Checks run on the BUILT dist/ — the truth users see.
name: Site PR checks

on:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Astro build
        run: npx astro build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  impeccable:
    name: Impeccable design review
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checks
        uses: actions/checkout@v7
        with:
          repository: Clickharder-Consulting-Inc/rp-site-checks
          path: .checks
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install detector deps
        working-directory: .checks/vendor/impeccable
        run: npm ci --omit=dev || npm install --omit=dev
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Detect
        run: node .checks/scripts/impeccable-gate.mjs dist

  compliance:
    name: Compliance review
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site (FACTS.json)
        uses: actions/checkout@v7
      - name: Checkout checks
        uses: actions/checkout@v7
        with:
          repository: Clickharder-Consulting-Inc/rp-site-checks
          path: .checks
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Check compliance anchors + grounding
        run: node .checks/scripts/compliance-check.mjs dist FACTS.json

  preview:
    name: Preview deploy
    needs: [impeccable, compliance]
    runs-on: ubuntu-latest
    # The URL is recorded as a deployment status so rpdms can show the operator
    # a reviewable link (it reads the commit's deployments when this check
    # completes). Without this the preview exists but nobody can find it.
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Skips visibly (not silently) when the SWA token secret is not yet
      # provisioned — the gate jobs above still protect the merge.
      - name: Deploy to SWA preview environment
        id: deploy
        env:
          SWA_TOKEN: ${{ secrets.AZURE_SWA_DEPLOY_TOKEN }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::warning::AZURE_SWA_DEPLOY_TOKEN not set — preview deploy skipped."
            echo "### Preview deploy skipped (no AZURE_SWA_DEPLOY_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail
          npx @azure/static-web-apps-cli deploy ./dist             --deployment-token "$SWA_TOKEN" --env preview 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.azurestaticapps\.net' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::warning::preview deployed but no URL could be read from the output."
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      # Recorded for rpdms: it reads the commit's deployment statuses when this
      # check completes, so the operator gets the link in the app.
      - name: Record the preview URL as a deployment status
        if: steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          dep=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id <<JSON
          {
            "ref": "$GITHUB_SHA",
            "environment": "preview",
            "auto_merge": false,
            "required_contexts": [],
            "transient_environment": true,
            "description": "rpdms PR preview"
          }
          JSON
          )
          gh api "repos/$GITHUB_REPOSITORY/deployments/$dep/statuses" --input - >/dev/null <<JSON
          {
            "state": "success",
            "environment_url": "$URL",
            "description": "Preview of this revision"
          }
          JSON
          echo "Recorded deployment $dep -> $URL"
